{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Django Blog</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="{% url 'home' %}">📝 Django Blog</a>
            </div>
            <form method="get" action="{% url 'home' %}" class="search-form">
                <input type="text" name="q" placeholder="Cari artikel..." class="search-input" value="{{ request.GET.q }}">
                <button type="submit" class="search-btn">🔍</button>
            </form>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to Django Blog</h1>
            <p>
                Temukan artikel menarik seputar teknologi,
                pemrograman, Artificial Intelligence,
                dan pengembangan web.
            </p>

        </div>
    </section>

    <!-- Content -->
    <main id="content" class="container">
        {% block content %}
        {% endblock content %}
    </main>

    <footer>
        © 2026 Django Blog. Made with passion for web and tech stories.
    </footer>

</body>

</html>
